basePath: /api/v1
definitions:
  clients.TeamYearMetric:
    properties:
      competing:
        properties:
          next_event_key:
            type: string
          next_event_name:
            type: string
          next_event_week:
            type: integer
          this_week:
            type: boolean
        type: object
      country:
        type: string
      district:
        type: string
      epa:
        properties:
          auto_points:
            type: number
          endgame_points:
            type: number
          mean:
            type: number
          rp_1:
            type: number
          rp_2:
            type: number
          rp_3:
            type: number
          teleop_points:
            type: number
          tiebreaker_points:
            type: number
          total_points:
            type: number
          unitless:
            type: number
        type: object
      name:
        type: string
      record:
        properties:
          count:
            type: integer
          losses:
            type: integer
          ties:
            type: integer
          winrate:
            type: number
          wins:
            type: integer
        type: object
      rookie_year:
        type: integer
      state:
        type: string
      team:
        type: integer
      year:
        type: integer
    type: object
  routes.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  routes.MetricDefinition:
    properties:
      description:
        type: string
      dimensions:
        description: '"time" (match-based), "single" (event-based)'
        items:
          type: string
        type: array
      key:
        type: string
      name:
        type: string
      source:
        description: '"tba", "statbotics", "pit", "match"'
        type: string
      type:
        description: '"number", "text", "boolean", "categorical"'
        type: string
    type: object
  routes.TbaEvent:
    properties:
      city:
        type: string
      country:
        type: string
      end_date:
        type: string
      event_code:
        type: string
      event_type:
        type: integer
      key:
        type: string
      name:
        type: string
      start_date:
        type: string
      state_prov:
        type: string
    type: object
  routes.TeamInfo:
    properties:
      alliance:
        type: string
      metrics:
        additionalProperties: true
        type: object
      team_number:
        type: integer
    type: object
  types.MatchPrediction:
    properties:
      actual_scores:
        additionalProperties:
          type: integer
        example:
          blue: 98
          red: 100
        type: object
      actual_winner:
        example: red
        type: string
      match_key:
        example: 2025mxle_qm1
        type: string
      predicted_scores:
        additionalProperties:
          type: integer
        example:
          blue: 112
          red: 95
        type: object
      predicted_winner:
        example: blue
        type: string
      shap_analysis:
        $ref: '#/definitions/types.ShapAnalysis'
      status:
        example: played
        type: string
      team_keys:
        $ref: '#/definitions/types.TbaTeamKeys'
      win_probability:
        additionalProperties:
          type: number
        example:
          blue: 0.79
          red: 0.21
        type: object
    type: object
  types.Result:
    properties:
      alliance_number:
        type: integer
      teams:
        items:
          type: integer
        type: array
      win_probability:
        type: number
      wins:
        type: integer
    type: object
  types.ShapAnalysis:
    properties:
      base_value:
        type: number
      feature_data:
        items:
          type: number
        type: array
      feature_names:
        items:
          type: string
        type: array
      values:
        items:
          type: number
        type: array
    type: object
  types.SimulationMetadata:
    properties:
      timestamp_utc:
        type: string
      total_simulations_run:
        type: integer
    type: object
  types.SimulationResponse:
    properties:
      event_key:
        type: string
      results:
        items:
          $ref: '#/definitions/types.Result'
        type: array
      simulation_metadata:
        $ref: '#/definitions/types.SimulationMetadata'
    type: object
  types.TbaTeamKeys:
    properties:
      blue:
        items:
          type: string
        type: array
      red:
        items:
          type: string
        type: array
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the API server for the Blue Banner Engine, providing FRC match
    predictions.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Blue Banner Engine (BBE) API
  version: "1.0"
paths:
  /analytics/match/{match_key}/teamsinfo:
    get:
      consumes:
      - application/json
      description: Retrieves detailed analytics for all six teams participating in
        a given FRC match from the Python service.
      parameters:
      - description: FRC Match Key (e.g., 2025mxle_f1m1)
        in: path
        name: match_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful retrieval of all team analytics
          schema:
            items:
              $ref: '#/definitions/routes.TeamInfo'
            type: array
        "400":
          description: Bad Request (e.g., missing match_key)
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: Internal Server Error (e.g., gRPC call failed)
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      summary: Get Analytics for All Teams in a Match
      tags:
      - analytics
  /analytics/teams:
    get:
      consumes:
      - application/json
      description: Retrieves detailed analytics for a custom list of up to 6 teams
        at a given event.
      parameters:
      - description: FRC Event Key (e.g., 2025mxle)
        in: query
        name: event_key
        required: true
        type: string
      - description: Comma-separated list of team numbers (e.g., 3478,4400,4775)
        in: query
        name: teams
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful retrieval of custom team analytics
          schema:
            items:
              $ref: '#/definitions/routes.TeamInfo'
            type: array
        "400":
          description: Bad Request (e.g., missing params, too many teams)
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: Internal Server Error (e.g., gRPC call failed)
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      summary: Get Analytics for a Custom List of Teams
      tags:
      - analytics
  /events/{year}:
    get:
      description: Retrieves a simplified list of all FRC events for a given year
        from The Blue Alliance.
      parameters:
      - description: FRC Year (e.g., 2024)
        in: path
        name: year
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/routes.TbaEvent'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      summary: Get All Events for a Year
      tags:
      - events
  /events/teams/{eventKey}:
    get:
      description: Retrieves a list of all team keys participating in a given FRC
        event from The Blue Alliance.
      parameters:
      - description: FRC Event Key (e.g., 2025mexas)
        in: path
        name: eventKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      summary: Get All Teams for an Event
      tags:
      - events
  /metrics/metadata:
    get:
      description: Returns a list of all available metrics for visualization.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/routes.MetricDefinition'
            type: array
      summary: Get Metric Metadata
      tags:
      - metrics
  /predict/event/{event_key}:
    get:
      consumes:
      - application/json
      description: Retrieves all match predictions for a given FRC event key from
        the BBE prediction service.
      parameters:
      - description: FRC Event Key (e.g., 2025mxle)
        in: path
        name: event_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful prediction for all matches
          schema:
            items:
              $ref: '#/definitions/types.MatchPrediction'
            type: array
        "500":
          description: Internal Server Error (e.g., gRPC call failed)
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      summary: Get All Match Predictions for an Event
      tags:
      - predictions
  /predict/event/{event_key}/playoff/{n_sims}:
    get:
      consumes:
      - application/json
      description: Using matchpoint predictor, simulates the playoff results for an
        event
      parameters:
      - description: FRC Event Key (e.g., 2025mxle)
        in: path
        name: event_key
        required: true
        type: string
      - description: Number of desired simulations (e.g., 1000)
        in: path
        name: n_sims
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successful prediction for all matches
          schema:
            items:
              $ref: '#/definitions/types.SimulationResponse'
            type: array
        "500":
          description: Internal Server Error (e.g., gRPC call failed)
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      summary: Get the playoff simulated n times for an Event
      tags:
      - predictions
  /predict/match/{match_key}:
    get:
      consumes:
      - application/json
      description: Retrieves a detailed prediction for a single FRC match, including
        SHAP analysis for model explainability.
      parameters:
      - description: FRC Match Key (e.g., 2025mxle_qm12)
        in: path
        name: match_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful prediction
          schema:
            $ref: '#/definitions/types.MatchPrediction'
        "500":
          description: Internal Server Error (e.g., gRPC call failed)
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      summary: Get Single Match Prediction with SHAP
      tags:
      - predictions
  /statbotics/team/{teamNumber}/metrics:
    get:
      description: Fetches EPA and other metrics from Statbotics for a specific team
        and year.
      parameters:
      - description: Team Number
        in: path
        name: teamNumber
        required: true
        type: integer
      - description: 'Year (default: current year)'
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clients.TeamYearMetric'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      summary: Get Statbotics Metrics for a Team
      tags:
      - metrics
  /tba/team/{teamNumber}/metrics:
    get:
      description: Fetches rankings and OPRs for a team at a specific event.
      parameters:
      - description: Team Number
        in: path
        name: teamNumber
        required: true
        type: integer
      - description: Event Key
        in: query
        name: eventKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      summary: Get TBA Metrics for a Team
      tags:
      - metrics
swagger: "2.0"
